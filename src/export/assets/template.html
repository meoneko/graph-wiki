<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Review Graph — __WORKSPACE__</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;
}

#app {
  display: grid;
  grid-template-rows: auto 1fr;
  grid-template-columns: 1fr 320px;
  width: 100%;
  height: 100%;
}

/* Toolbar */
#toolbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: #16213e;
  border-bottom: 1px solid #0f3460;
  flex-wrap: wrap;
}

#toolbar .filters {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

#toolbar .filters label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  cursor: pointer;
  user-select: none;
}

#toolbar .filters input[type="checkbox"] {
  accent-color: #3B82F6;
}

#toolbar .search-box {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}

#search {
  padding: 4px 10px;
  border: 1px solid #0f3460;
  border-radius: 4px;
  background: #1a1a2e;
  color: #e0e0e0;
  font-size: 13px;
  width: 200px;
}

#search::placeholder { color: #666; }
#search:focus { outline: none; border-color: #3B82F6; }

/* SVG graph area */
#graph {
  grid-column: 1;
  grid-row: 2;
  overflow: hidden;
  position: relative;
}

#graph svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* Node styles */
.node { cursor: pointer; }
.node circle { stroke: #fff; stroke-width: 1.5px; }
.node text { font-size: 10px; fill: #ccc; pointer-events: none; }
.node.highlighted circle { stroke: #FFD700; stroke-width: 3px; }
.node.dimmed { opacity: 0.2; }

.link { stroke: #444; stroke-opacity: 0.6; stroke-width: 1px; }
.link.dimmed { opacity: 0.1; }

/* Metadata panel */
#panel {
  grid-column: 2;
  grid-row: 2;
  background: #16213e;
  border-left: 1px solid #0f3460;
  padding: 16px;
  overflow-y: auto;
}

#panel h2 {
  font-size: 14px;
  margin-bottom: 12px;
  color: #3B82F6;
}

#panel .meta-row {
  margin-bottom: 8px;
  font-size: 12px;
}

#panel .meta-row .key {
  color: #888;
  display: block;
  margin-bottom: 2px;
}

#panel .meta-row .value {
  color: #e0e0e0;
  word-break: break-all;
}

#panel .empty-state {
  color: #666;
  font-size: 13px;
  font-style: italic;
}

/* Confidence band colors */
.band-authoritative { fill: #3B82F6; }
.band-extracted { fill: #22C55E; }
.band-inferred { fill: #F59E0B; }
.band-ambiguous { fill: #EF4444; }
</style>
</head>
<body>
<div id="app">
  <!-- Toolbar with filters and search -->
  <div id="toolbar">
    <div class="filters" id="kind-filters">
      <!-- Filter checkboxes will be generated by the visualization script -->
    </div>
    <div class="search-box">
      <input type="text" id="search" placeholder="Search nodes..." autocomplete="off">
    </div>
  </div>

  <!-- SVG graph container -->
  <div id="graph">
    <svg></svg>
  </div>

  <!-- Node metadata panel -->
  <div id="panel">
    <h2>Node Details</h2>
    <div class="empty-state">Click a node to view its metadata.</div>
  </div>
</div>

<!-- D3.js bundle (inlined) -->
<script>
__D3_BUNDLE__
</script>

<!-- Graph data and workspace context -->
<script>
var GRAPH_DATA = __GRAPH_DATA__;
var WORKSPACE = "__WORKSPACE__";
</script>

<!-- Visualization script -->
<script>
(function() {
  'use strict';

  var nodes = GRAPH_DATA.nodes;
  var edges = GRAPH_DATA.edges;

  // --- SVG setup with zoom/pan ---
  var svgEl = document.querySelector('#graph svg');
  var width = svgEl.clientWidth || 960;
  var height = svgEl.clientHeight || 600;

  var svg = d3.select('#graph svg');
  var g = svg.append('g');

  var zoom = d3.zoom()
    .scaleExtent([0.1, 8])
    .on('zoom', function(event) {
      g.attr('transform', event.transform);
    });
  svg.call(zoom);

  // --- Confidence band color mapping ---
  var bandClass = {
    AUTHORITATIVE: 'band-authoritative',
    EXTRACTED: 'band-extracted',
    INFERRED: 'band-inferred',
    AMBIGUOUS: 'band-ambiguous'
  };

  // --- Force simulation ---
  var simulation = d3.forceSimulation(nodes)
    .force('charge', d3.forceManyBody().strength(-100))
    .force('link', d3.forceLink(edges).id(function(d) { return d.id; }).distance(80))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .on('tick', ticked);

  // --- Render edges as lines ---
  var linkGroup = g.append('g').attr('class', 'links');
  var link = linkGroup.selectAll('line')
    .data(edges)
    .enter()
    .append('line')
    .attr('class', 'link');

  // --- Render nodes as g > circle + text ---
  var nodeGroup = g.append('g').attr('class', 'nodes');
  var node = nodeGroup.selectAll('g')
    .data(nodes)
    .enter()
    .append('g')
    .attr('class', 'node')
    .call(d3.drag()
      .on('start', dragStarted)
      .on('drag', dragged)
      .on('end', dragEnded)
    )
    .on('click', function(event, d) {
      showPanel(d);
    });

  node.append('circle')
    .attr('r', 8)
    .attr('class', function(d) {
      return bandClass[d.confidence_band] || 'band-inferred';
    });

  node.append('text')
    .attr('dx', 12)
    .attr('dy', 4)
    .text(function(d) { return d.label; });

  // --- Tick function ---
  function ticked() {
    link
      .attr('x1', function(d) { return d.source.x; })
      .attr('y1', function(d) { return d.source.y; })
      .attr('x2', function(d) { return d.target.x; })
      .attr('y2', function(d) { return d.target.y; });

    node.attr('transform', function(d) {
      return 'translate(' + d.x + ',' + d.y + ')';
    });
  }

  // --- Drag behavior ---
  function dragStarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
  }

  function dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
  }

  function dragEnded(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null;
    d.fy = null;
  }

  // --- Click handler: populate #panel with node metadata ---
  function showPanel(d) {
    var panel = document.getElementById('panel');
    panel.innerHTML =
      '<h2>Node Details</h2>' +
      metaRow('Kind', d.kind) +
      metaRow('Label', d.label) +
      metaRow('Source File', d.source_file || '—') +
      metaRow('Confidence', d.confidence_band) +
      metaRow('Project', d.project_id);
  }

  function metaRow(key, value) {
    return '<div class="meta-row"><span class="key">' + escapeHtml(key) +
      '</span><span class="value">' + escapeHtml(value) + '</span></div>';
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // --- Filter checkboxes: toggle node/edge visibility by kind ---
  var kinds = [];
  var kindSet = {};
  nodes.forEach(function(n) {
    if (!kindSet[n.kind]) {
      kindSet[n.kind] = true;
      kinds.push(n.kind);
    }
  });
  kinds.sort();

  var filtersEl = document.getElementById('kind-filters');
  var activeKinds = {};
  kinds.forEach(function(kind) {
    activeKinds[kind] = true;
    var label = document.createElement('label');
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = true;
    cb.value = kind;
    cb.addEventListener('change', function() {
      activeKinds[kind] = cb.checked;
      applyFilters();
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(' ' + kind));
    filtersEl.appendChild(label);
  });

  function applyFilters() {
    node.each(function(d) {
      var visible = activeKinds[d.kind];
      d3.select(this).style('display', visible ? null : 'none');
    });

    link.each(function(d) {
      var sourceNode = typeof d.source === 'object' ? d.source : findNode(d.source);
      var targetNode = typeof d.target === 'object' ? d.target : findNode(d.target);
      var visible = sourceNode && targetNode &&
        activeKinds[sourceNode.kind] && activeKinds[targetNode.kind];
      d3.select(this).style('display', visible ? null : 'none');
    });
  }

  function findNode(id) {
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].id === id) return nodes[i];
    }
    return null;
  }

  // --- Search input: highlight matching nodes ---
  var searchInput = document.getElementById('search');
  searchInput.addEventListener('input', function() {
    var query = searchInput.value.trim().toLowerCase();
    if (!query) {
      node.classed('highlighted', false).classed('dimmed', false);
      link.classed('dimmed', false);
      return;
    }

    node.each(function(d) {
      var matches = d.label.toLowerCase().indexOf(query) !== -1;
      d3.select(this).classed('highlighted', matches).classed('dimmed', !matches);
    });

    link.classed('dimmed', true);
  });

  // --- Handle window resize ---
  window.addEventListener('resize', function() {
    width = svgEl.clientWidth || 960;
    height = svgEl.clientHeight || 600;
    simulation.force('center', d3.forceCenter(width / 2, height / 2));
    simulation.alpha(0.3).restart();
  });
})();
</script>
</body>
</html>
